<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src blob: data:; connect-src 'none'; form-action 'none'; base-uri 'none'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>印记 · 离线照片水印</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f2ed;color:#23352e;font:15px system-ui}header{padding:28px 5%;border-bottom:1px solid #dcded6;display:flex;justify-content:space-between}h1{margin:0;font-size:24px}small{color:#64776c}main{max-width:1400px;margin:30px auto;padding:0 4%;display:grid;grid-template-columns:310px 1fr;gap:28px}aside,section{background:white;border-radius:18px;padding:24px}label{display:block;margin:20px 0 8px;font-weight:600}input:not([type=checkbox]),select,button{width:100%;padding:11px;border:1px solid #d4dcd5;border-radius:8px;background:white;color:inherit}input[type=range]{padding:0}button{cursor:pointer;background:#255c46;color:white;border:0;margin-top:15px;font-weight:600}button:disabled{opacity:.4;cursor:default}.stage{background:#e8ece7;min-height:440px;display:flex;align-items:center;justify-content:center;border:2px dashed #cad5cc;border-radius:12px;overflow:hidden}canvas{max-width:100%;max-height:65vh;object-fit:contain}#empty{text-align:center;color:#6b7b70;line-height:2}#list{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}#list button{width:auto;margin:0;background:#e7eee8;color:#28513d;max-width:190px;overflow:hidden;text-overflow:ellipsis}p{line-height:1.7}#status{min-height:25px;color:#506657}@media(max-width:760px){main{grid-template-columns:1fr}header small{display:none}.stage{min-height:260px}}</style><header><h1>印记 <small>／ 离线照片水印</small></h1><small>本地处理 · 无需联网 · 照片不上传</small></header><main><aside><b>把署名，留在作品上。</b><label for="files">选择照片（支持多选）</label><input id="files" type="file" multiple accept="image/jpeg,image/png,image/webp"><label for="words">水印文字</label><input id="words" value="© 我的摄影作品" maxlength="150"><label for="size">字号 <span id="sv"></span></label><input id="size" type="range" min="1" max="12" value="4" step="0.5"><label for="opacity">透明度 <span id="ov"></span></label><input id="opacity" type="range" min="5" max="100" value="55"><label for="color">文字颜色</label><input id="color" type="color" value="#ffffff"><label for="position">位置</label><select id="position"><option value="br">右下角</option><option value="bl">左下角</option><option value="tr">右上角</option><option value="tl">左上角</option><option value="center">居中</option><option value="tile" selected>全图平铺</option></select><label for="angle">旋转角度 <span id="av"></span></label><input id="angle" type="range" min="-60" max="60" value="0"><label><input id="shadow" type="checkbox" checked> 添加文字阴影</label><label for="format">导出格式</label><select id="format"><option value="image/png">PNG（无损）</option><option value="image/jpeg">JPEG（高质量）</option></select><button id="save" disabled>保存当前照片</button><button id="all" disabled>批量保存全部</button><p><small>保留照片原始像素尺寸。导出会重新生成图片，不复制原文件的 EXIF 元数据。建议保留原照片。</small></p></aside><section><div class="stage" id="drop"><div id="empty">＋<br>选择或拖入照片<br><small>支持 JPG、PNG、WebP</small></div><canvas id="canvas" hidden></canvas></div><div id="list"></div><p id="status" role="status">等待选择照片。所有处理均在本机完成。</p></section></main><script>
'use strict';const $=id=>document.getElementById(id),c=$('canvas'),ctx=c.getContext('2d');let photos=[],current=0,busy=false;const ids=['words','size','opacity','color','position','angle','shadow','format'];function render(){ $('sv').textContent=$('size').value+'%';$('ov').textContent=$('opacity').value+'%';$('av').textContent=$('angle').value+'°';if(!photos.length)return;const im=photos[current].im;c.width=im.naturalWidth;c.height=im.naturalHeight;ctx.clearRect(0,0,c.width,c.height);ctx.drawImage(im,0,0);const text=$('words').value;if(!text)return;const s=Math.min(c.width,c.height)*Number($('size').value)/100,pad=Math.min(c.width,c.height)*.045;ctx.font=`600 ${s}px system-ui,sans-serif`;ctx.fillStyle=$('color').value;ctx.globalAlpha=Number($('opacity').value)/100;ctx.textBaseline='middle';if($('shadow').checked){ctx.shadowColor='rgba(0,0,0,.65)';ctx.shadowBlur=s*.12;ctx.shadowOffsetY=s*.04}const a=Number($('angle').value)*Math.PI/180;function stamp(x,y){ctx.save();ctx.translate(x,y);ctx.rotate(a);ctx.fillText(text,0,0);ctx.restore()}const w=ctx.measureText(text).width,pos=$('position').value;if(pos==='tile'){ctx.textAlign='center';const stepX=Math.max(w+s*3,s*8),stepY=s*5;for(let y=-c.height;y<c.height*2;y+=stepY)for(let x=-c.width;x<c.width*2;x+=stepX)stamp(x+(Math.round(y/stepY)%2)*stepX/2,y)}else{ctx.textAlign=pos==='center'?'center':pos.endsWith('r')?'right':'left';stamp(pos==='center'?c.width/2:pos.endsWith('r')?c.width-pad:pad,pos==='center'?c.height/2:pos.startsWith('t')?pad+s/2:c.height-pad-s/2)}ctx.globalAlpha=1;ctx.shadowBlur=0;ctx.shadowOffsetY=0}
async function add(files){let failed=0;for(const f of files){if(!/^image\/(jpeg|png|webp)$/.test(f.type)){failed++;continue}const url=URL.createObjectURL(f);try{const im=new Image();im.src=url;await im.decode();photos.push({im,name:f.name});}catch{failed++}finally{URL.revokeObjectURL(url)}}if(photos.length){current=photos.length-1;$('empty').hidden=true;c.hidden=false;$('save').disabled=$('all').disabled=false;list();render()}$('status').textContent=`已载入 ${photos.length} 张照片。${failed?'有 '+failed+' 个文件格式不支持或无法读取。':''}`}
function list(){$('list').replaceChildren();photos.forEach((p,i)=>{const b=document.createElement('button');b.textContent=(i===current?'● ':'')+p.name;b.onclick=()=>{if(busy)return;current=i;list();render()};$('list').append(b)})}async function save(){render();const blob=await new Promise(r=>c.toBlob(r,$('format').value,.94));if(!blob)throw Error('图片过大，无法导出');const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=photos[current].name.replace(/\.[^.]+$/,'')+'-水印.'+($('format').value==='image/png'?'png':'jpg');a.click();setTimeout(()=>URL.revokeObjectURL(url),10000)}$('files').onchange=e=>add(e.target.files);ids.forEach(id=>$(id).oninput=render);$('save').onclick=async()=>{try{await save();$('status').textContent='已生成照片，请查看浏览器下载。'}catch(e){$('status').textContent=e.message}};$('all').onclick=async()=>{busy=true;$('all').disabled=$('save').disabled=true;const old=current;try{for(current=0;current<photos.length;current++){await save();await new Promise(r=>setTimeout(r,350))}$('status').textContent='已生成全部照片；若下载被拦截，请允许此页面下载多个文件。'}catch(e){$('status').textContent=e.message}finally{current=old;busy=false;$('all').disabled=$('save').disabled=false;render();list()}};$('drop').ondragover=e=>e.preventDefault();$('drop').ondrop=e=>{e.preventDefault();add(e.dataTransfer.files)};render();
</script></html>
